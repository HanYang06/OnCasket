[project]
name = "oncasket"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HanYang06", email = "jihanyang123@163.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "hatchling>=1.32.4",
    "onconf>=2.1.0a1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[project.scripts]
oncasket = "oncasket:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true
