[project]
name = "oncasket"
version = "1.0.0a1"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<3.15"
authors = [{ name = "HanYang06", email = "jihanyang123@163.com" }]
maintainers = [{ name = "HanYang06", email = "jihanyang123@163.com" }]
keywords = [
    "storage",
    "storage-engine",
    "binary-format",
    "file-format",
    "embedded",
    "no-server",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = [
    "onconf>=2.1.0",
    "xxhash>=4.0.1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "codespell>=2.4.3",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "zizmor>=1.30.1",
]

[project.scripts]
oncasket = "oncasket._cli:main"

[project.urls]
Homepage = "https://github.com/HanYang06/OnCasket"
Repository = "https://github.com/HanYang06/OnCasket"
Issues = "https://github.com/HanYang06/OnCasket/issues"
Changelog = "https://github.com/HanYang06/OnCasket/blob/main/docs/CHANGELOG/index.md"
Security = "https://github.com/HanYang06/OnCasket/security/advisories/new"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

# 与 CI 中 astral-sh/setup-uv 的 version 保持一致，避免本地与 CI 解析出不同结果
[tool.uv]
required-version = ">=0.12.22"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

# ============================================================================
# Ruff —— lint + format
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv"]
output-format = "concise"
preview = false

[tool.ruff.lint]
select = [
    "A",    # 内建名遮蔽
    "ANN",  # 类型注解
    "ARG",  # 未使用参数
    "B",    # flake8-bugbear
    "BLE",  # 盲捕异常
    "C4",   # 推导式
    "C90",  # 圈复杂度
    "CPY",  # 版权头（SPDX）
    "D",    # pydocstyle
    "DTZ",  # 时区
    "E",    # pycodestyle error
    "EM",   # 异常消息
    "ERA",  # 注释掉的死代码
    "F",    # pyflakes
    "FA",   # from __future__ import annotations
    "FBT",  # 布尔参数陷阱
    "FLY",  # f-string 优化
    "FURB", # refurb
    "G",    # logging 格式
    "I",    # isort
    "ICN",  # 导入命名约定
    "INP",  # 隐式命名空间包
    "INT",  # gettext
    "ISC",  # 隐式字符串拼接
    "LOG",  # logging 用法
    "N",    # pep8-naming
    "PERF", # 性能反模式
    "PGH",  # pygrep-hooks
    "PIE",  # 杂项
    "PL",   # pylint
    "PT",   # pytest 风格
    "PTH",  # pathlib
    "RET",  # return 简化
    "RSE",  # raise 简化
    "RUF",  # ruff 自有规则
    "S",    # bandit 安全规则
    "SIM",  # 可简化代码
    "SLF",  # 私有成员访问
    "T10",  # 调试器残留
    "T20",  # print
    "TC",   # 类型检查专用导入
    "TD",   # TODO 格式
    "TID",  # 整洁导入
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warning
]
ignore = [
    # --- 与 formatter 冲突，必须关 ---
    "COM812", # 尾随逗号交给 formatter
    "ISC001", # 单行隐式拼接与 formatter 冲突
    # --- pydocstyle 互斥项 ---
    "D203", # 与 D211 互斥
    "D213", # 与 D212 互斥
    # --- 全中文代码库的必然误伤 ---
    # RUF001/002/003 把「，。：；（）」判为 ambiguous-unicode。
    # 本项目注释与文档统一使用中文标点，这是有意为之，不是笔误。
    "RUF001",
    "RUF002",
    "RUF003",
    # --- 与仓库既有口径一致的四条 ---
    "D400",   # 首行以句号结尾：中文句号在 D 规则里对不上
    "D415",   # 同上，最后一行标点
    "EM101",  # 异常消息字面量：本项目异常消息短、直给
    "EM102",  # f-string 异常消息：同上
    "TRY003", # 长异常消息内联：同上
    "ANN401", # 语义上真任意的位置（配置值）允许 Any
    "PLR0913",# 参数个数上限：构造函数不可避免
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",                   # 测试用 assert 是本分
    "ANN",                    # 测试函数不必全注解
    "D101", "D102", "D103",   # 测试不需要 docstring
    "PLR2004",                # 测试里的魔法值就是断言值
    "SLF001",                 # 测试需要触碰私有实现
    "INP001",                 # tests 不是包
    "PT011",                  # pytest.raises 不强制 match
]
"scripts/**" = ["T201", "INP001"]  # 脚本就是往 stdout 写
"src/oncasket/_cli.py" = ["T201"]  # CLI 入口往 stdout 写，是本分

[tool.ruff.lint.flake8-copyright]
# 源码必须有 SPDX 许可头（Apache-2.0）
notice-rgx = "(?i)SPDX-License-Identifier:\\s*Apache-2\\.0"
min-file-size = 1

[tool.ruff.lint.isort]
known-first-party = ["oncasket"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

# ============================================================================
# mypy —— 严格模式
# ============================================================================
[tool.mypy]
python_version = "3.14"
# 模块名的两级根：`src/` 下是 oncasket，仓库根下是 tests/。
# 少了这两行，mypy 会把 tests/ 里的文件当**顶层模块**（test_park，而不是 tests.format.test_park），
# 既匹配不到 tests.* 的 override，不同目录下的同名测试文件也会撞 Duplicate module。
mypy_path = ["src", "."]
explicit_package_bases = true
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true
extra_checks = true
no_implicit_reexport = true
disallow_any_unimported = true
disallow_any_explicit = false

# 测试可以宽松：pytest fixture 的注入形态与严格注解天然冲突。
# tests/ 下没有 __init__.py（pytest --import-mode=importlib），但配了 mypy_path +
# explicit_package_bases，mypy 把它们当**命名空间包**：模块名形如 tests.<目录>.<文件名>，
# 所以一条通配就够 —— 加测试文件不必再改这里。
[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_unimported = false
warn_return_any = false

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
]
xfail_strict = true
# 警告即错误：任何 ResourceWarning / DeprecationWarning 都必须当场处理。
filterwarnings = ["error"]

# ============================================================================
# coverage
# ============================================================================
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# fail_under 由 pytest-cov 在报告阶段强制（CI 的 test job 会因此变红）。
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
    "@typing.overload",
    "\\.\\.\\.",
]

[tool.coverage.html]
show_contexts = true

# ============================================================================
# bandit —— 安全静态扫描（由 -c pyproject.toml 读取）
# ============================================================================
[tool.bandit]
targets = ["src"]
exclude_dirs = [".venv", "tests", "docs", "scripts"]

# ============================================================================
# codespell —— 拼写检查
# ============================================================================
[tool.codespell]
skip = "./.venv,./uv.lock,./.git,./.mypy_cache,./.ruff_cache,./.pytest_cache"
count = true
quiet-level = 2
