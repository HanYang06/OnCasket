# ============================================================================
# Dependabot —— 依赖与 action 的自动更新
#
# 说明：Dependabot 开的 PR 走的是普通 pull_request 流程，
# 因此会自动触发 ci.yml（lint / typecheck / test / security）与
# dependency-review.yml；合并前必须等这些检查通过。
# ============================================================================
version: 2
updates:
  # --------------------------------------------------------------------------
  # Python 依赖
  #
  # 用 "pip" ecosystem：它解析 pyproject.toml / uv.lock，并按 uv 的
  # dependency-groups 归类，是当前最成熟的写法。
  # --------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # 运行时依赖（[project].dependencies）：会被下游使用者继承，
      # 单独成组便于逐条评估兼容性影响。
      runtime-dependencies:
        dependency-type: production
      # dev 组（pytest / mypy / ruff / bandit 等）：只影响开发者本地与 CI。
      dev-dependencies:
        dependency-type: development

  # --------------------------------------------------------------------------
  # GitHub Actions
  #
  # 本仓库所有 action 都固定在 commit SHA 上；Dependabot 会连同行尾的
  # `# vX.Y.Z` 版本注释一起更新——注释缺失时它无法识别当前版本，
  # 所以每个 uses 行都必须保留版本注释。
  # --------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - github-actions
    groups:
      # 所有 action 更新合成一个 PR：action 升级之间常相互牵违，
      # 分批反而更难验证。
      github-actions:
        patterns:
          - "*"
